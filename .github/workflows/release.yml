name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      - name: Test
        run: make test

      - name: Build DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          QUOTAI_SIGN_IDENTITY: ${{ secrets.QUOTAI_SIGN_IDENTITY }}
          QUOTAI_NOTARY_PROFILE: ${{ secrets.QUOTAI_NOTARY_PROFILE }}
        run: make dmg

      - name: Release title
        id: release
        run: echo "title=QuotAI ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: Scripts/release/notes.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release.outputs.title }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/QuotAI-*.dmg
          generate_release_notes: false
          prerelease: false
