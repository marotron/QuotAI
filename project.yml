name: QuotAI
options:
  bundleIdPrefix: dev.marotron
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  QuotAICore:
    type: framework
    platform: macOS
    sources:
      - QuotAICore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marotron.QuotAICore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  QuotAI:
    type: application
    platform: macOS
    sources:
      - QuotAI
    dependencies:
      - target: QuotAICore
      - sdk: libsqlite3.tbd
    # actool emits a sparse AppIcon.icns; Dock needs the full multi-size pack file.
    postCompileScripts:
      - name: Embed full AppIcon.icns
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/docs/brand/AppIcon.icns"
          DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          cp -f "$SRC" "$DST"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marotron.QuotAI
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: 11
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: QuotAI
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  QuotAICoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - QuotAICore/Tests
    dependencies:
      - target: QuotAICore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marotron.QuotAICoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  QuotAI:
    build:
      targets:
        QuotAI: all
        QuotAICore: all
        QuotAICoreTests: [test]
    test:
      targets:
        - QuotAICoreTests
    run:
      config: Debug
